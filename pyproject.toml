[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myjarvis"
version = "0.1.0"
description = "My personal Jarvis assistant, built on OpenJarvis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pinned to a known commit; bump deliberately.
    "OpenJarvis @ git+https://github.com/open-jarvis/OpenJarvis@ae36ac97e9adcd55e8cf6e98b6274948ab28134c",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
myjarvis = "myjarvis.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/myjarvis"]
