[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Mon assistant personnel Jarvis, construit sur OpenJarvis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Épinglé sur un commit précis ; à mettre à jour volontairement.
    "OpenJarvis @ git+https://github.com/open-jarvis/OpenJarvis@ae36ac97e9adcd55e8cf6e98b6274948ab28134c",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis-ai = "jarvis.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
