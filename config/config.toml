# Configuration de Jarvis (format OpenJarvis).
# Chargée automatiquement par `jarvis-ai` ; utilisez --config pour en choisir une autre.

[engine]
default = "ollama"

[engine.ollama]
host = "http://localhost:11434"

[intelligence]
default_model = "qwen3.5:4b"      # rapide ; essayez "qwen3.5:9b" pour de meilleures réponses

[agent]
default_agent = "orchestrator"    # plusieurs tours, avec appel d'outils
max_turns = 8
tools = "current_time,calculator,think,web_search"   # web_search accède à Internet
system_prompt = """Tu es Jarvis, un assistant personnel qui fonctionne en local sur la machine de l'utilisateur.
Réponds toujours en français, de façon concise et précise.
Utilise les outils quand ils sont utiles ; n'invente jamais le résultat d'un outil."""

[analytics]
enabled = false                   # aucune donnée d'utilisation ne quitte cette machine
